<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NestEgg — Household Budget</title>
<meta name="description" content="NestEgg keeps one household's whole budget in one place: what comes in, what goes out, what is left for the things that matter.">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/dashboard" aria-label="NestEgg home">
    <span class="brand-mark" aria-hidden="true">◉</span>
    <span class="brand-name">NestEgg</span>
    <span class="brand-tag">household budget</span>
  </a>
  <div class="topbar-right">
    <label class="month-pick" for="monthSelect">Month
      <select id="monthSelect" aria-label="Choose month"></select>
    </label>
    <button id="addTxBtn" class="btn btn-primary" type="button">+ Add transaction</button>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" aria-label="Sections">
    <a href="#/dashboard" data-nav="dashboard"><span class="nav-ico" aria-hidden="true">▦</span> Dashboard</a>
    <a href="#/transactions" data-nav="transactions"><span class="nav-ico" aria-hidden="true">⇄</span> Transactions</a>
    <a href="#/budgets" data-nav="budgets"><span class="nav-ico" aria-hidden="true">▤</span> Budgets</a>
    <a href="#/bills" data-nav="bills"><span class="nav-ico" aria-hidden="true">☰</span> Bills &amp; Goals</a>
    <a href="#/reports" data-nav="reports"><span class="nav-ico" aria-hidden="true">▧</span> Reports</a>
    <div class="side-note">
      <strong>The Alvarez family</strong>
      <span>2 adults · 2 kids · one shared pot</span>
      <span id="sideSaved">Saved this year: —</span>
    </div>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<nav class="bottomnav" aria-label="Sections">
  <a href="#/dashboard" data-nav="dashboard">▦<span>Home</span></a>
  <a href="#/transactions" data-nav="transactions">⇄<span>Money</span></a>
  <a href="#/budgets" data-nav="budgets">▤<span>Budgets</span></a>
  <a href="#/bills" data-nav="bills">☰<span>Bills</span></a>
  <a href="#/reports" data-nav="reports">▧<span>Reports</span></a>
</nav>

<footer class="foot">
  <span>NestEgg runs entirely in your browser — your numbers never leave this device.</span>
  <span>
    <button id="exportBtn" class="linklike" type="button">Export CSV</button> ·
    <button id="resetBtn" class="linklike" type="button">Reset demo data</button>
  </span>
</footer>

<div id="modalRoot" class="modal-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:2rem;text-align:center">NestEgg needs JavaScript to add up your budget.</p></noscript>
</body>
</html>
